<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" role="img" aria-labelledby="title desc">
<title id="title">A fallback changes who can be scored</title>
<desc id="desc">The share of all positive test ratings scorable under each population policy. Different scopes, not model lift.</desc>
<rect width="820" height="300" fill="#f6f8fc"/>
<text x="32" y="34" font-family="sans-serif" font-size="23" fill="#132b45">A warm-only result hides a cold-start service problem</text>
<text x="32" y="62" font-family="sans-serif" font-size="15" fill="#476079">Scorable positive ratings / all positive test ratings; fixed training catalog</text>
<text x="32" y="125" font-family="sans-serif" font-size="16">Warm-user model only</text>
<rect x="275" y="102" width="45.14" height="34" rx="4" fill="#68809b"/>
<text x="330.14" y="125" font-family="sans-serif" font-size="17">10.26%</text>
<text x="32" y="205" font-family="sans-serif" font-size="16">Model + popularity fallback</text>
<rect x="275" y="182" width="430.65" height="34" rx="4" fill="#1a827f"/>
<text x="715.65" y="205" font-family="sans-serif" font-size="17">97.88%</text>
<text x="32" y="280" font-family="sans-serif" font-size="14" fill="#476079">This is population coverage, not improved recommendation quality.</text>
</svg>